{% extends "base.html" %}

{% block title %}多要素認証 | open-hoikuict{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
  <section class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
    <p class="text-sm font-medium text-indigo-600">多要素認証</p>
    <h1 class="mt-2 text-3xl font-semibold text-slate-900">認証コードを入力</h1>
    <p class="mt-3 text-sm leading-7 text-slate-600">登録メールアドレスに送信された 6 桁の認証コードを入力してください。</p>

    {% if form_error %}
    <div class="mt-6 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800" role="alert">
      {{ form_error }}
    </div>
    {% endif %}

    <form method="post" action="/staff/mfa/verify" class="mt-7 space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="redirect_to" value="{{ redirect_to }}">
      <label class="block text-sm font-medium text-slate-700">
        認証コード
        <input
          type="text"
          name="code"
          autocomplete="off"
          required
          autofocus
          inputmode="numeric"
          maxlength="6"
          class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 text-center text-lg font-mono focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
        >
      </label>
      <button type="submit" class="w-full rounded-xl bg-indigo-600 px-4 py-3 font-medium text-white hover:bg-indigo-700">
        認証する
      </button>
    </form>

    <div class="mt-6 border-t border-slate-200 pt-5 text-sm text-slate-600">
      <p>メールが届かない場合は、迷惑メールフォルダを確認してください。</p>
      <a href="/staff/login" class="font-medium text-indigo-600 hover:underline">ログイン画面に戻る</a>
    </div>
  </section>
</div>
{% endblock %}
