{% extends "base.html" %}

{% block title %}施設シフト設定 | open-hoikuict{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <p class="text-sm font-semibold text-indigo-600">施設設定</p>
      <h1 class="mt-1 text-2xl font-bold text-slate-900">シフト施設設定</h1>
      <p class="mt-2 text-sm text-slate-600">開園/閉園時刻、粒度、定員、配置基準を設定します。</p>
    </div>
  </div>

  <form method="post" action="/shifts/facility" class="space-y-4">
    <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="text-lg font-semibold text-slate-900">営業時間・粒度</h2>
      <div class="mt-4 grid gap-4 sm:grid-cols-2">
        <div>
          <label class="block text-sm font-medium text-slate-700">開園時刻</label>
          <input type="time" name="day_open" value="{{ settings.day_open }}" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">閉園時刻</label>
          <input type="time" name="day_close" value="{{ settings.day_close }}" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">粒度（分）</label>
          <input type="number" name="granularity_min" value="{{ settings.granularity_min }}" min="5" max="120" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">定員</label>
          <input type="number" name="capacity" value="{{ settings.capacity }}" min="1" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2">
        </div>
      </div>
    </section>

    <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="text-lg font-semibold text-slate-900">配置基準</h2>
      <div class="mt-4 grid gap-4 sm:grid-cols-2">
        <div>
          <label class="block text-sm font-medium text-slate-700">配置基準キー</label>
          <select name="staffing_standard_key" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2">
            <option value="fukuoka_city" {% if settings.staffing_standard_key == 'fukuoka_city' %}selected{% endif %}>福岡市</option>
            <option value="osaka_city" {% if settings.staffing_standard_key == 'osaka_city' %}selected{% endif %}>大阪市</option>
            <option value="tokyo" {% if settings.staffing_standard_key == 'tokyo' %}selected{% endif %}>東京都</option>
            <option value="generic" {% if settings.staffing_standard_key == 'generic' %}selected{% endif %}>汎用</option>
          </select>
        </div>
        <div>
          <label class="flex items-center gap-2 text-sm font-medium text-slate-700">
            <input type="checkbox" name="min_two_staff_role" value="1" {% if settings.min_two_staff_rule %}checked{% endif %} class="rounded-slate-900">
            最低2人体制ルール
          </label>
        </div>
        <div>
          <label class="flex items-center gap-2 text-sm font-medium text-slate-700">
            <input type="checkbox" name="enforce_min_two" value="1" {% if settings.enforce_min_two %}checked{% endif %} class="rounded-slate-900">
            最低2人体制を強制
          </label>
        </div>
      </div>
    </section>

    <div class="flex justify-end">
      <button type="submit" class="rounded-xl bg-indigo-600 px-6 py-2 text-sm font-semibold text-white hover:bg-indigo-700">設定を保存</button>
    </div>
  </form>

  <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="text-lg font-semibold text-slate-900">休園日・祝日</h2>
    <form method="post" action="/shifts/facility/closed-days" class="mt-4 flex gap-2">
      <input type="date" name="target_date" required class="flex-1 rounded-lg border border-slate-300 px-3 py-2">
      <select name="kind" class="rounded-lg border border-slate-300 px-3 py-2">
        <option value="closed">休園日</option>
        <option value="holiday">祝日</option>
      </select>
      <button type="submit" class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">追加</button>
    </form>

    {% if closed_days %}
    <table class="mt-4 min-w-full divide-y divide-slate-200 text-sm">
      <thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500">
        <tr><th class="px-3 py-3">日付</th><th class="px-3 py-3">種別</th></tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        {% for day in closed_days %}
        <tr><td class="px-3 py-3">{{ day.target_date }}</td><td class="px-3 py-3">{{ day.kind }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
    {% endif %}
  </section>
</div>
{% endblock %}
