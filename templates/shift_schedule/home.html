{% extends "base.html" %}

{% block title %}職員シフト | open-hoikuict{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <p class="text-sm font-semibold text-indigo-600">職員シフト管理</p>
      <h1 class="mt-1 text-2xl font-bold text-slate-900">シフトダッシュボード</h1>
      <p class="mt-2 text-sm text-slate-600">職員のシフト自動作成・編集・公開を管理します。</p>
    </div>
    <a href="/shifts/plans" class="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">新しいシフトプランを作成</a>
  </div>

  {% if not cbc_available %}
  <div class="rounded-xl border border-rose-200 bg-rose-50 p-4">
    <h2 class="font-semibold text-rose-900">CBC ソルバ未検出</h2>
    <p class="mt-1 text-sm text-rose-700">PULP_CBC_CMD が見つかりません。シフト自動作成は利用できません。</p>
  </div>
  {% endif %}

  <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="text-lg font-semibold text-slate-900">クイックアクション</h2>
    <div class="mt-4 grid gap-4 sm:grid-cols-3">
      <a href="/shifts/facility" class="rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm font-medium text-slate-700 hover:bg-slate-100">施設設定</a>
      <a href="/shifts/contracts" class="rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm font-medium text-slate-700 hover:bg-slate-100">職員契約・資格</a>
      <a href="/shifts/plans" class="rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm font-medium text-slate-700 hover:bg-slate-100">シフトプラン一覧</a>
    </div>
  </section>
</div>
{% endblock %}
