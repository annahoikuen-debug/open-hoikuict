<dialog id="message-template-picker-modal" class="p-0 rounded-2xl shadow-2xl backdrop:bg-slate-900/50 border-0 max-w-lg w-full">
  <div class="bg-white p-6 space-y-4">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
        <span>📋</span> 定型文を選択して挿入
      </h3>
      <button type="button" onclick="document.getElementById('message-template-picker-modal').close()" class="text-slate-400 hover:text-slate-600 font-bold p-1">✕</button>
    </div>

    <div id="picker-template-list" class="space-y-2 max-h-80 overflow-y-auto">
      <p class="text-xs text-slate-400 py-4 text-center">読み込み中...</p>
    </div>

    <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-xs">
      <a href="/message-templates" target="_blank" class="text-indigo-600 hover:underline">定型文の管理・追加 →</a>
      <button type="button" onclick="document.getElementById('message-template-picker-modal').close()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-xl font-semibold">閉じる</button>
    </div>
  </div>
</dialog>

<script>
  let activeTemplateTargetId = null;

  async function openMessageTemplatePicker(category, targetElementId) {
    activeTemplateTargetId = targetElementId;
    const modal = document.getElementById('message-template-picker-modal');
    const list = document.getElementById('picker-template-list');
    if (!modal || !list) return;

    list.innerHTML = '<p class="text-xs text-slate-400 py-4 text-center">読み込み中...</p>';
    modal.showModal();

    try {
      const res = await fetch(`/message-templates/options?category=${encodeURIComponent(category || '')}`);
      if (!res.ok) throw new Error('定型文の取得に失敗しました');
      const data = await res.json();
      if (!data.length) {
        list.innerHTML = '<p class="text-xs text-slate-400 py-6 text-center">利用可能な定型文がありません。<br><a href="/message-templates" class="text-indigo-600 underline mt-1 inline-block">管理画面から登録してください</a></p>';
        return;
      }
      list.innerHTML = data.map(item => `
        <div class="p-3 bg-slate-50 hover:bg-indigo-50/70 rounded-xl border border-slate-200 transition cursor-pointer" onclick='insertMessageTemplate(${JSON.stringify(item.content)})'>
          <div class="flex items-center justify-between">
            <span class="font-bold text-sm text-slate-900">${escapePickerHtml(item.title)}</span>
            <span class="text-[10px] text-indigo-600 bg-white border border-indigo-200 px-2 py-0.5 rounded font-semibold">挿入する →</span>
          </div>
          <p class="text-xs text-slate-600 mt-1 leading-relaxed">${escapePickerHtml(item.content)}</p>
        </div>
      `).join('');
    } catch (e) {
      list.innerHTML = `<p class="text-xs text-rose-600 py-4 text-center">${e.message}</p>`;
    }
  }

  function insertMessageTemplate(content) {
    if (!activeTemplateTargetId) return;
    const target = document.getElementById(activeTemplateTargetId);
    if (!target) return;

    if (target.tagName === 'TEXTAREA' || target.tagName === 'INPUT') {
      const cur = target.value;
      if (cur.trim().length > 0) {
        target.value = cur + '\n' + content;
      } else {
        target.value = content;
      }
      target.dispatchEvent(new Event('input', { bubbles: true }));
      target.focus();
    } else if (target.isContentEditable) {
      target.innerHTML += (target.innerHTML.trim().length > 0 ? '<br>' : '') + escapePickerHtml(content);
      target.dispatchEvent(new Event('input', { bubbles: true }));
      target.focus();
    }

    document.getElementById('message-template-picker-modal')?.close();
  }

  function escapePickerHtml(str) {
    return (str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]);
  }
</script>
