<!-- キーボードショートカット ヘルプモーダル (I1) -->
<dialog id="shortcut-help-modal" class="p-0 rounded-2xl shadow-2xl backdrop:bg-slate-900/60 border-0 max-w-lg w-full">
  <div class="bg-white p-6">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
        <span>⌨️</span> キーボードショートカット一覧
      </h3>
      <button type="button" id="shortcut-modal-close-btn" class="text-slate-400 hover:text-slate-600 text-sm font-bold p-1 rounded" aria-label="ヘルプを閉じる">✕</button>
    </div>

    <div class="mt-4 space-y-4 text-sm">
      <div>
        <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">画面移動 (2ストローク)</div>
        <div class="space-y-2">
          <div class="flex items-center justify-between py-1 border-b border-slate-50">
            <span class="text-slate-700">ホーム (ダッシュボード) へ移動</span>
            <span class="flex gap-1">
              <kbd class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded font-mono text-xs text-slate-700">g</kbd>
              <kbd class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded font-mono text-xs text-slate-700">d</kbd>
            </span>
          </div>
          <div class="flex items-center justify-between py-1 border-b border-slate-50">
            <span class="text-slate-700">出欠一覧・打刻へ移動</span>
            <span class="flex gap-1">
              <kbd class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded font-mono text-xs text-slate-700">g</kbd>
              <kbd class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded font-mono text-xs text-slate-700">a</kbd>
            </span>
          </div>
          <div class="flex items-center justify-between py-1 border-b border-slate-50">
            <span class="text-slate-700">日次連絡帳へ移動</span>
            <span class="flex gap-1">
              <kbd class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded font-mono text-xs text-slate-700">g</kbd>
              <kbd class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded font-mono text-xs text-slate-700">c</kbd>
            </span>
          </div>
          <div class="flex items-center justify-between py-1 border-b border-slate-50">
            <span class="text-slate-700">お知らせ管理へ移動</span>
            <span class="flex gap-1">
              <kbd class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded font-mono text-xs text-slate-700">g</kbd>
              <kbd class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded font-mono text-xs text-slate-700">n</kbd>
            </span>
          </div>
        </div>
      </div>

      <div>
        <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">共通操作</div>
        <div class="space-y-2">
          <div class="flex items-center justify-between py-1 border-b border-slate-50">
            <span class="text-slate-700">横断検索バーにフォーカス</span>
            <span class="flex gap-1">
              <kbd class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded font-mono text-xs text-slate-700">/</kbd>
              <span class="text-slate-400 text-xs">または</span>
              <kbd class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded font-mono text-xs text-slate-700">s</kbd>
            </span>
          </div>
          <div class="flex items-center justify-between py-1 border-b border-slate-50">
            <span class="text-slate-700">このショートカット一覧を開く</span>
            <kbd class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded font-mono text-xs text-slate-700">?</kbd>
          </div>
          <div class="flex items-center justify-between py-1">
            <span class="text-slate-700">ダイアログ・モーダルを閉じる</span>
            <kbd class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded font-mono text-xs text-slate-700">Esc</kbd>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-6 flex justify-end">
      <button type="button" onclick="document.getElementById('shortcut-help-modal').close()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-semibold transition">閉じる</button>
    </div>
  </div>
</dialog>
