services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: open-hoikuict:local
    pull_policy: build
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      HOIKUICT_PROFILE: ${HOIKUICT_PROFILE:-embedded}
      HOIKUICT_DATABASE_URL: sqlite:////data/hoikuict.db
      HOIKU_FACILITY_BUNREI_DB_PATH: /data/facility.sqlite
      HOIKU_NURSERY_REF: ${NURSERY_REF:-ひかり保育園}
      # 単一園オールインワン本番設定（起動時に security_config.validate_runtime_security() で検証）
      HOIKUICT_ENV: ${HOIKUICT_ENV:-production}
      HOIKUICT_ENABLE_MOCK_AUTH: ${HOIKUICT_ENABLE_MOCK_AUTH:-0}
      HOIKUICT_STAFF_AUTH_MODE: ${HOIKUICT_STAFF_AUTH_MODE:-local_password}
      HOIKUICT_PARENT_AUTH_MODE: ${HOIKUICT_PARENT_AUTH_MODE:-local_password}
      HOIKUICT_COOKIE_SECURE: ${HOIKUICT_COOKIE_SECURE:-1}
      HOIKUICT_CSRF_ENFORCE: ${HOIKUICT_CSRF_ENFORCE:-1}
      HOIKUICT_SECRET_KEY: ${HOIKUICT_SECRET_KEY:?HOIKUICT_SECRET_KEY is required}
      HOIKUICT_LOGIN_THROTTLE_HMAC_KEY: ${HOIKUICT_LOGIN_THROTTLE_HMAC_KEY:?HOIKUICT_LOGIN_THROTTLE_HMAC_KEY is required}
      HOIKUICT_PASSWORD_BLOCKLIST_PATH: ${HOIKUICT_PASSWORD_BLOCKLIST_PATH:-/app/assets/password-blocklist.txt}
      HOIKUICT_ALLOWED_ORIGINS: ${HOIKUICT_ALLOWED_ORIGINS:?HOIKUICT_ALLOWED_ORIGINS is required}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?FORWARDED_ALLOW_IPS is required}
      HOIKUICT_PARENT_MAIL_TRANSPORT: ${HOIKUICT_PARENT_MAIL_TRANSPORT:-smtp}
      HOIKUICT_PARENT_REGISTRATION_BASE_URL: ${HOIKUICT_PARENT_REGISTRATION_BASE_URL:?HOIKUICT_PARENT_REGISTRATION_BASE_URL is required}
      HOIKUICT_SMTP_HOST: ${HOIKUICT_SMTP_HOST:?HOIKUICT_SMTP_HOST is required}
      HOIKUICT_SMTP_PORT: ${HOIKUICT_SMTP_PORT:-587}
      HOIKUICT_SMTP_STARTTLS: ${HOIKUICT_SMTP_STARTTLS:-1}
      HOIKUICT_PARENT_MAIL_FROM: ${HOIKUICT_PARENT_MAIL_FROM:?HOIKUICT_PARENT_MAIL_FROM is required}
      # 任意の機能設定
      HOIKUICT_KIOSK_ACCESS_MODE: ${HOIKUICT_KIOSK_ACCESS_MODE:-disabled}
      HOIKUICT_PUSH_TRANSPORT: ${HOIKUICT_PUSH_TRANSPORT:-disabled}
      HOIKUICT_PREVIEW_DIR: /data/data_transfer_previews
      HOIKUICT_BACKUP_CONTROL_DIR: /data/backup-control
      HOIKUICT_BACKUP_REPLICA_TARGETS: ${BACKUP_REPLICA_TARGETS:-}
    volumes:
      - ${APP_DATA_PATH:-hoikuict_data}:/data
      - ${APP_STORAGE_PATH:-hoikuict_storage}:/app/storage
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: open-hoikuict:local
    pull_policy: build
    profiles:
      - operations
    restart: "no"
    network_mode: none
    environment:
      TZ: Asia/Tokyo
      HOIKUICT_DATABASE_URL: sqlite:////data/hoikuict.db
      HOIKU_FACILITY_BUNREI_DB_PATH: /data/facility.sqlite
      HOIKUICT_STORAGE_ROOT: /app/storage
    volumes:
      - ${APP_DATA_PATH:-hoikuict_data}:/data
      - ${APP_STORAGE_PATH:-hoikuict_storage}:/app/storage
      - ${BACKUP_SET_PATH:-hoikuict_backups}:/backup
    entrypoint:
      - python
      - -m
      - scripts.backup_runtime
    command:
      - --help

  backup-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: open-hoikuict:local
    pull_policy: build
    restart: unless-stopped
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TZ: Asia/Tokyo
      HOIKUICT_ENV: ${HOIKUICT_ENV:-production}
      HOIKUICT_DATABASE_URL: sqlite:////data/hoikuict.db
      HOIKU_FACILITY_BUNREI_DB_PATH: /data/facility.sqlite
      HOIKU_NURSERY_REF: ${NURSERY_REF:-ひかり保育園}
      HOIKUICT_STORAGE_ROOT: /app/storage
      HOIKUICT_BACKUP_CONTROL_DIR: /data/backup-control
      HOIKUICT_BACKUP_OUTPUT_ROOT: /backup
      HOIKUICT_BACKUP_GIT_SHA: ${BACKUP_GIT_SHA:-0000000000000000000000000000000000000000}
      HOIKUICT_BACKUP_APP_IMAGE: ${BACKUP_APP_IMAGE:-open-hoikuict:local}
      HOIKUICT_BACKUP_COMPOSE_SHA256: ${BACKUP_COMPOSE_SHA256:-}
      HOIKUICT_BACKUP_COMPOSE_FILE: /app/deploy/dockge/compose.yaml
      HOIKUICT_BACKUP_CLOUDFLARED_IMAGE: ${CLOUDFLARED_IMAGE:-unknown}
      HOIKUICT_BACKUP_RECOVERY_KIT_REF: ${BACKUP_RECOVERY_KIT_REF:-}
      HOIKUICT_BACKUP_BASELINE_REF: ${BACKUP_BASELINE_REF:-}
    volumes:
      - ${APP_DATA_PATH:-hoikuict_data}:/data
      - ${APP_STORAGE_PATH:-hoikuict_storage}:/app/storage
      - ${BACKUP_SET_PATH:-hoikuict_backups}:/backup
    entrypoint:
      - python
      - -m
      - scripts.backup_worker

volumes:
  hoikuict_data:
  hoikuict_storage:
  hoikuict_backups:
