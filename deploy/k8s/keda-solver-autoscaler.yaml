apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: nushift-solver-autoscaler
  namespace: nusoft
  labels:
    app.kubernetes.io/name: nushift-solver
    app.kubernetes.io/part-of: nusoft-saas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nushift-solver-worker
  minReplicaCount: 0
  maxReplicaCount: 20
  cooldownPeriod: 300
  pollingInterval: 10
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 4
              periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
  triggers:
    - type: redis
      metadata:
        addressFromEnv: REDIS_URL
        listName: hoikuict:shift:solve_queue
        listLength: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nushift-solver-worker
  namespace: nusoft
  labels:
    app: nushift-solver-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: nushift-solver-worker
  template:
    metadata:
      labels:
        app: nushift-solver-worker
    spec:
      tolerations:
        - key: "spot"
          operator: "Exists"
          effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      containers:
        - name: solver-worker
          image: ghcr.io/hoikuict/nushift-solver:v0.7.1
          command: ["python", "-m", "shift_schedule.services.distributed_worker"]
          resources:
            requests:
              cpu: "1000m"
              memory: "1024Mi"
            limits:
              cpu: "4000m"
              memory: "4096Mi"
          env:
            - name: HOIKUICT_ENV
              value: "production"
            - name: HOIKUICT_SHIFT_SOLVER
              value: "HiGHS"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nusoft-secrets
                  key: redis-url
            - name: HOIKUICT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nusoft-secrets
                  key: database-url
